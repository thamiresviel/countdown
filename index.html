<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Em Breve</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <p class="label">algo grande está chegando</p>
      <h1 class="titulo">EM BREVE</h1>

      <div class="countdown" id="countdown">
        <div class="bloco">
          <span class="numero" id="dias">00</span>
          <span class="legenda">dias</span>
        </div>
        <div class="separador">:</div>
        <div class="bloco">
          <span class="numero" id="horas">00</span>
          <span class="legenda">horas</span>
        </div>
        <div class="separador">:</div>
        <div class="bloco">
          <span class="numero" id="minutos">00</span>
          <span class="legenda">minutos</span>
        </div>
        <div class="separador">:</div>
        <div class="bloco">
          <span class="numero" id="segundos">00</span>
          <span class="legenda">segundos</span>
        </div>
      </div>

      <p class="mensagem" id="mensagem"></p>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
